# Yayındaki sayfaların gerçek afişlerle ekran görüntüsünü alır (bu çalışma alanı dış sitelere bağlanamadığı için).
name: Önizleme görüntüleri

on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Boşlukla ayrılmış adresler (site köküne göre)"
        required: false
        default: "yeni/#/?sec=1 yeni/#/ankara yeni/#/ankara/kesfet?k=konser yeni/#/ankara/sinema"

permissions:
  contents: write

concurrency:
  group: sosyal
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - name: Görüntüler
        env:
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          cat > s.mjs <<'JS'
          import { chromium, devices } from "playwright";
          const b = await chromium.launch(); const c = await b.newContext({ ...devices["Pixel 7"] }); const p = await c.newPage();
          const list = (process.env.PATHS || "").split(/\s+/).filter(Boolean); let i = 0;
          for (const u of list) {
            await p.goto("https://nevarneyok.net.tr/" + u, { waitUntil: "networkidle" }).catch(() => {});
            await p.waitForTimeout(2500);
            await p.screenshot({ path: `shot-${++i}.png`, fullPage: false });
            if (u.endsWith("#/ankara")) {
              const ev = await p.evaluate(() => { const a = document.querySelector(".rail .cd"); return a && a.getAttribute("href"); });
              await p.evaluate(() => scrollTo(0, 1300)); await p.waitForTimeout(2000); await p.screenshot({ path: `shot-${++i}.png` });
              if (ev) { await p.goto("https://nevarneyok.net.tr/yeni/" + ev, { waitUntil: "networkidle" }); await p.waitForTimeout(2500); await p.screenshot({ path: `shot-${++i}.png` }); await p.evaluate(() => scrollTo(0, 1100)); await p.waitForTimeout(3000); await p.screenshot({ path: `shot-${++i}.png` }); }
            }
          }
          await b.close();
          JS
          node s.mjs
      - name: sosyal dalına koy (onizleme/)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "nevarneyok-bot"; git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 --branch sosyal "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" sos
          rm -rf sos/onizleme && mkdir -p sos/onizleme && cp shot-*.png sos/onizleme/
          cd sos && git add -A && git commit -qm "Önizleme görüntüleri" && { git push -q origin sosyal || { git pull -q --rebase origin sosyal && git push -q origin sosyal; }; } || true
