# Uygulama içi reklam görselleri (gerçek ekranlar telefon çerçevesinde; gönderi 4:5 + hikâye 9:16) → "sosyal" dalı <tarih>/uygulama-reklam/
name: Uygulama reklam görselleri

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Ekranlardaki iller, ilki ana il (boşlukla)"
        required: false
        default: ankara istanbul izmir antalya
      sadece_turkiye:
        description: "Yalnızca 'Tüm Türkiye cebinde' hikâyesi (hızlı)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sosyal
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null || true
      - name: Tüm Türkiye hikâyesi
        working-directory: scraper
        env:
          OUT_DIR: /tmp/uygulama
        run: node hero.mjs && node etiket.mjs && node nasil.mjs
      - name: Görselleri üret
        if: github.event.inputs.sadece_turkiye != 'true'
        working-directory: scraper
        env:
          OUT_DIR: /tmp/uygulama
          SHOT_CITIES: ${{ github.event.inputs.city || 'ankara istanbul izmir antalya' }}
        run: node appshots.mjs
      - name: sosyal dalına ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(date +%F)/uygulama-reklam"
          git config --global user.name "nevarneyok-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone -q --depth 1 --branch sosyal "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/sosyal
          cd /tmp/sosyal && mkdir -p "$D" && cp /tmp/uygulama/* "$D/"
          git add -A && git commit -qm "Uygulama reklam görselleri: $D" || exit 0
          git push -q origin sosyal || { git pull -q --rebase origin sosyal && git push -q origin sosyal; }
