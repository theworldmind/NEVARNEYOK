# Kaynak keşfi: verilen sayfaların bağlantı yapısını yalnızca günlüğe yazar. Depoya hiçbir şey kaydetmez.
name: Kaynak keşfi

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Boşlukla ayrılmış adresler"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sayfaları incele
        working-directory: scraper
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: node probe.mjs $URLS
