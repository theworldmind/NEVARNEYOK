# Kaynak keşfi: verilen sayfaların bağlantı yapısını yalnızca günlüğe yazar. Depoya hiçbir şey kaydetmez.
name: Kaynak keşfi

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Boşlukla ayrılmış adresler (boş bırakılabilir)"
        required: false
      sinema:
        description: "Sinema zincirlerinin halk günü/indirim/fiyat sayfalarını incele (sinema-kesif.mjs)"
        type: boolean
        default: false
      denetim:
        description: "Kapsam denetimini de çalıştır (yalnızca günlüğe yazar, depoya kaydetmez)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bağımlılıkları kur
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sayfaları incele
        working-directory: scraper
        env:
          URLS: ${{ github.event.inputs.urls }}
          PROBE_FULL: "1"
        run: '[ -z "$URLS" ] || [ "${{ github.event.inputs.sinema }}" = "true" ] || node probe.mjs $URLS'
      - name: Sinema indirimleri (keşif)
        if: github.event.inputs.sinema == 'true'
        working-directory: scraper
        env: { URLS: "${{ github.event.inputs.urls }}", RENDER: "1" }
        run: node sinema-kesif.mjs
      - name: Kapsam denetimi (deneme)
        if: github.event.inputs.denetim == 'true'
        working-directory: scraper
        run: node audit.mjs && cat out/coverage.md
