# Sen bir dosyayı elle değiştirip GitHub'a yüklediğinde siteyi hemen yeniden yayınlar
# (tarama yapmaz; tarama "Etkinlikleri güncelle" iş akışında)
name: Siteyi yayınla

on:
  push:
    branches: [main]
    paths-ignore: ["scraper/**", ".github/workflows/update.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Google sayfalarını üret
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: node scraper/build-pages.mjs
      - name: Paylaşım sayfaları (81 il, her etkinlik; WhatsApp/Instagram önizlemesi)
        continue-on-error: true
        run: node scraper/share-pages.mjs
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scraper' --exclude '_site' --exclude 'README.md' --exclude 'CLAUDE.md' --exclude 'data/coverage.json' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub bazen yüklenen paketi birkaç saniye geç görüyor ("No artifacts named github-pages"): bekle, olmazsa bir kez daha dene
      - run: sleep 15
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
