# Sen bir dosyayı elle değiştirip GitHub'a yüklediğinde siteyi hemen yeniden yayınlar
# (tarama yapmaz; tarama "Etkinlikleri güncelle" iş akışında)
name: Siteyi yayınla

on:
  push:
    branches: [main]
    paths-ignore: ["scraper/**", ".github/workflows/update.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Google sayfalarını üret
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: node scraper/build-pages.mjs
      # Hikâye görselleri: afişini telefona çizdirmeyen sitelerin etkinlikleri için (scraper/share-img.mjs); önceki yayının görselleri saklanır
      - name: Beraber yer verisi ve görselleri (ayrı dallardan)
        continue-on-error: true
        run: |
          U="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for p in "beraber-gorsel yg" "beraber-veri yv"; do set -- $p; rm -rf "/tmp/$2" "$2"; if git clone -q --depth 1 -b "$1" "$U" "/tmp/$2" 2>/dev/null; then rm -rf "/tmp/$2/.git"; mv "/tmp/$2" "$2"; fi; done
      - uses: actions/cache@v4
        with:
          path: s
          key: paylas-gorsel-${{ github.run_id }}
          restore-keys: paylas-gorsel-
      - name: Paylaşım ve davet görselleri (afiş + logo, 7 gün) ve hikâye görselleri (4 gün)
        continue-on-error: true
        timeout-minutes: 40
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node share-img.mjs
      - name: Paylaşım sayfaları (81 il, her etkinlik; WhatsApp/Instagram önizlemesi)
        continue-on-error: true
        run: node scraper/share-pages.mjs
      - name: 81 il için Google sayfaları (/<il>/, hafta sonu, bugün, kategoriler)
        continue-on-error: true
        run: node scraper/il-pages.mjs
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scraper' --exclude '_site' --exclude 'README.md' --exclude 'CLAUDE.md' --exclude 'data/coverage.json' ./ _site/
      - name: Harita motorunu siteye koy
        continue-on-error: true
        run: |
          V=$(sed -n 's/.*const ML_V = "\([^"]*\)".*/\1/p' app.js | head -1)
          mkdir -p _site/vendor/maplibre
          for f in maplibre-gl.js maplibre-gl.css; do curl -fsSL --retry 3 -o "_site/vendor/maplibre/$f" "https://unpkg.com/maplibre-gl@$V/dist/$f"; done
      - name: Yayından önce denetim (eksikse yayınlama)
        run: node scraper/site-check.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub bazen yüklenen paketi birkaç saniye geç görüyor ("No artifacts named github-pages"): bekle, olmazsa bir kez daha dene
      - run: sleep 15
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Yayından sonra canlı denetim
        run: |
          for u in / /app.js /data/cities.json /idx/harita.json; do
            ok=0; for i in 1 2 3 4 5 6 7 8; do curl -fsS -o /dev/null --max-time 40 "https://nevarneyok.net.tr$u" && { ok=1; break; }; sleep 20; done
            [ $ok = 1 ] || { echo "::error::Canlı sitede açılmıyor: $u"; exit 1; }
          done
