# Mekân konumları (81 il): OpenStreetMap'teki yerler il il alınır, bizim mekân adlarıyla eşleştirilir (scraper/geo-osm.mjs).
name: Mekan konumlari

# "Şehirleri güncelle" bitince kendiliğinden başlatılır.
on:
  workflow_dispatch:
    inputs:
      deneme:
        description: "Yalnızca dene, kaydetme"
        type: boolean
        default: false
      iller:
        description: "Yalnızca bu iller (boşlukla; boş = hepsi)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: konum
  cancel-in-progress: false

jobs:
  konum:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Bağımlılıkları kur
        working-directory: scraper
        run: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --no-audit --no-fund
      - name: Türkiye'nin OpenStreetMap kopyası (Geofabrik)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL --retry 3 -o /tmp/tr.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          osmium tags-filter /tmp/tr.pbf nwr/amenity=theatre,cinema,arts_centre,community_centre,conference_centre,events_venue,exhibition_centre,music_venue,planetarium,stage,nightclub,bar,pub,biergarten,cafe,restaurant,library,social_centre,university,college,townhall nwr/tourism=museum,gallery,hotel,attraction,theme_park,zoo,aquarium,resort nwr/leisure=stadium,sports_centre,sports_hall,park,marina,water_park,dance,bowling_alley,ice_rink,garden nwr/shop=mall nwr/building=civic,public,theatre,cinema,university,stadium,sports_hall,hotel,commercial nwr/historic=castle,monument,ruins,archaeological_site,building r/admin_level=4 -o /tmp/f.pbf --overwrite
          osmium export /tmp/f.pbf -f geojsonseq -o /tmp/tr.geojsonseq --overwrite
          ls -la /tmp/tr.pbf /tmp/f.pbf /tmp/tr.geojsonseq
      - name: İlçe sınırları (mekân adındaki ilçeden doğru il)
        continue-on-error: true
        run: |
          osmium tags-filter /tmp/tr.pbf r/admin_level=6 -o /tmp/a6.pbf --overwrite
          osmium export /tmp/a6.pbf -f geojsonseq -o /tmp/ilce.seq --overwrite --geometry-types=polygon
      - name: Overture yerleri (adı bilinen mekânlar, anahtarsız açık veri)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install -q --break-system-packages overturemaps duckdb
          python3 -m overturemaps.cli download --bbox=25.6,35.8,44.9,42.2 -f geoparquet --type=place -o /tmp/ov.parquet || overturemaps download --bbox=25.6,35.8,44.9,42.2 -f geoparquet --type=place -o /tmp/ov.parquet
          python3 scraper/ov-yerler.py /tmp/ov.parquet /tmp/ov.tsv
      - name: Eşleştir
        working-directory: scraper
        env:
          GEO_DRY: ${{ github.event.inputs.deneme }}
          GEO_ILLER: ${{ github.event.inputs.iller }}
        run: node geo-osm.mjs
      - name: Kalan mekânlar ve sinema salonları adresleriyle
        if: github.event.inputs.deneme != 'true'
        continue-on-error: true
        timeout-minutes: 45
        working-directory: scraper
        env:
          GEO_SCOPE: tr
          GEO_MAX: "1500"
        run: node geo.mjs
      - name: Yanlış ildeki etkinlikleri doğru ile taşı
        if: github.event.inputs.deneme != 'true'
        continue-on-error: true
        run: node scraper/sehirler-birlestir.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geo-osm
          path: scraper/out/geo-osm.tsv
          if-no-files-found: ignore
          retention-days: 3
      - name: Kaydet ve yayınla
        if: github.event.inputs.deneme != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nevarneyok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/venues.json data/venues-tr.json data/geo-miss.json data/geo-miss-tr.json data/c data/cities.json data/one-cikan.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -qm "Mekân konumları: $(date '+%d.%m.%Y %H:%M')"
          for i in 1 2 3 4; do git pull -q --rebase --autostash -X theirs && git push -q && break; sleep 8; done
          gh workflow run pages.yml --ref main
