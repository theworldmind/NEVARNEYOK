# Beraber daveti, Aşama 0: ölçüm ve örnek görseller. Siteye hiçbir şey yazmaz; çıktılar ayrı dallara gider.
name: Beraber olcum

on:
  workflow_dispatch:
    inputs:
      is:
        description: "ornek, olcum ya da ikisi"
        default: ikisi

permissions:
  contents: write

jobs:
  canli:
    if: github.event.inputs.is == 'canli'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { OUT: /tmp/canli }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/canli.mjs
      - if: always()
        run: cd /tmp/canli && git init -q -b beraber-canli && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Canlı deneme" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-canli
  davet:
    if: github.event.inputs.is == 'davet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { OUT: /tmp/canli }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/davet.mjs
      - if: always()
        run: cd /tmp/canli && git init -q -b beraber-canli && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Davet denemesi" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-canli
  ada:
    if: github.event.inputs.is == 'ada'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { OUT: /tmp/ada }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/ada-ornek.mjs
      - if: always()
        run: cd /tmp/ada && git init -q -b beraber-ada && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Ada" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-ada
  gba:
    if: github.event.inputs.is == 'gba'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { OUT: /tmp/gba }
    steps:
      - uses: actions/checkout@v4
      - run: python3 scraper/beraber/gba.py
      - if: always()
        run: cd /tmp/gba && git init -q -b beraber-gba && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "GBA" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" beraber-gba
  yukseklik:
    if: github.event.inputs.is == 'yukseklik'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { OUT: /tmp/gba }
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages ijson && mkdir -p /tmp/gba && python3 scraper/beraber/gba-yap.py
      - if: always()
        run: cd /tmp/gba && git init -q -b beraber-yukseklik && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Bina yükseklikleri" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" beraber-yukseklik
  bina:
    if: github.event.inputs.is == 'bina'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { OUT: /tmp/bina }
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages ijson && mkdir -p /tmp/bina && python3 scraper/beraber/gba-bina.py
      - if: always()
        run: cd /tmp/bina && git init -q -b beraber-bina && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Bina tabanları" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" beraber-bina
  ornek:
    if: github.event.inputs.is == 'ornek' || github.event.inputs.is == 'ikisi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: { TZ: Europe/Istanbul, OUT: /tmp/ornek }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tarayıcı
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Örnekleri üret
        working-directory: scraper
        run: node beraber/ornek.mjs
      - name: Dala yaz
        if: always()
        run: |
          cd /tmp/ornek && git init -q -b beraber-ornek && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Örnek görseller" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-ornek
  olcum:
    if: github.event.inputs.is == 'olcum' || github.event.inputs.is == 'ikisi'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { TZ: Europe/Istanbul, OUT: /tmp/olcum }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Araçlar
        run: |
          pip install -q overturemaps duckdb
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Overture yerleri (Türkiye çerçevesi)
        run: overturemaps download --bbox=25.6,35.8,44.9,42.2 -f geoparquet --type=place -o /tmp/ov.parquet && ls -la /tmp/ov.parquet
      - name: OpenStreetMap kopyası
        run: |
          curl -fsSL --retry 3 -o /tmp/tr.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          osmium tags-filter /tmp/tr.pbf nwr/amenity,tourism,leisure,shop,historic,office,craft -o /tmp/p.pbf --overwrite
          osmium export /tmp/p.pbf -f geojsonseq -o /tmp/poi.seq --overwrite
          osmium tags-filter /tmp/tr.pbf w/building -o /tmp/b.pbf --overwrite
          osmium tags-filter /tmp/b.pbf w/height w/building:levels -o /tmp/h.pbf --overwrite
          B=$(osmium fileinfo -e -g data.count.ways /tmp/b.pbf); Y=$(osmium fileinfo -e -g data.count.ways /tmp/h.pbf); echo "{\"bina\":$B,\"yukseklik_bilgili\":$Y}" > /tmp/bina.json; cat /tmp/bina.json
      - name: Ölç
        run: python scraper/beraber/olcum.py
      - name: Dala yaz
        if: always()
        run: |
          cd /tmp/olcum && git init -q -b beraber-olcum && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Ölçüm" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-olcum
