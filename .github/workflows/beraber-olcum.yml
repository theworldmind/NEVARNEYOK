# Beraber daveti, Aşama 0: ölçüm ve örnek görseller. Siteye hiçbir şey yazmaz; çıktılar ayrı dallara gider.
name: Beraber olcum

on:
  workflow_dispatch:
    inputs:
      is:
        description: "ornek, olcum ya da ikisi"
        default: ikisi

permissions:
  contents: write

jobs:
  sokak:
    if: github.event.inputs.is == 'sokak'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scraper/beraber/sokak-olcum.mjs
  ego:
    if: github.event.inputs.is == 'ego'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scraper/beraber/ego-kesif.mjs
  canli:
    if: github.event.inputs.is == 'canli'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { OUT: /tmp/canli }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/canli.mjs
      - if: always()
        run: cd /tmp/canli && git init -q -b beraber-canli && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Canlı deneme" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-canli
  davet:
    if: github.event.inputs.is == 'davet'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { OUT: /tmp/canli }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/davet.mjs
      - if: always()
        run: cd /tmp/canli && git init -q -b beraber-canli && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Davet denemesi" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-canli
  reklam:
    if: github.event.inputs.is == 'reklam'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { OUT: /tmp/reklam, SRC: /tmp/src }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: git fetch -q origin +refs/heads/beraber-canli:refs/remotes/origin/beraber-canli && mkdir -p /tmp/src && git archive origin/beraber-canli | tar -x -C /tmp/src
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node davet-reklam.mjs
      - if: always()
        run: cd /tmp/reklam && git init -q -b beraber-reklam && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Reklam" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-reklam
  cesium:
    if: github.event.inputs.is == 'cesium'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { OUT: /tmp/ces }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/cesium-ornek.mjs
      - if: always()
        run: cd /tmp/ces && git init -q -b beraber-cesium && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Cesium" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-cesium
  film:
    if: github.event.inputs.is == 'film' || github.event.inputs.is == 'uydu'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OUT: /tmp/film
      SAT: ${{ github.event.inputs.is == 'uydu' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/film-ornek.mjs
      - if: always()
        run: cd /tmp/film && git init -q -b beraber-film && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Film" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-film
  kampus:
    if: github.event.inputs.is == 'kampus'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: |
          mkdir -p /tmp/k; cd /tmp/k
          Q='[out:json][timeout:50];(way(around:350,39.9347,32.8276)["amenity"~"university|college"];relation(around:350,39.9347,32.8276)["amenity"~"university|college"];way(around:350,39.9347,32.8276)["landuse"~"education|university"];way(around:350,39.9347,32.8276)["building"]["name"];);out geom tags;'
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.kumi.systems/api/interpreter; do sleep 3; curl -sS -m 90 -A NeVarNeYokBot --data-urlencode "data=$Q" "$u" -o k.json && python3 -c "import json;print(len(json.load(open('k.json'))['elements']))" && break; done
          git init -q -b beraber-kampus; git add .; git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm Kampus; git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-kampus
  hesap:
    if: github.event.inputs.is == 'hesap'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { OUT: /tmp/hesap }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/hesap-ornek.mjs
      - if: always()
        run: cd /tmp/hesap && git init -q -b beraber-hesap && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm Hesap && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-hesap
  harita:
    if: github.event.inputs.is == 'harita'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env: { OUT: /tmp/harita }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/ara-ornek.mjs || true
          node beraber/pt-ornek.mjs || true
          node beraber/harita-ornek.mjs
      - if: always()
        run: cd /tmp/harita && git init -q -b beraber-harita && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Harita" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-harita
  ada:
    if: github.event.inputs.is == 'ada'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: { OUT: /tmp/ada }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node beraber/ada-ornek.mjs
      - if: always()
        run: cd /tmp/ada && git init -q -b beraber-ada && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Ada" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-ada
  gba:
    if: github.event.inputs.is == 'gba'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { OUT: /tmp/gba }
    steps:
      - uses: actions/checkout@v4
      - run: python3 scraper/beraber/gba.py
      - if: always()
        run: cd /tmp/gba && git init -q -b beraber-gba && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "GBA" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" beraber-gba
  yukseklik:
    if: github.event.inputs.is == 'yukseklik'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { OUT: /tmp/gba }
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages ijson && mkdir -p /tmp/gba && python3 scraper/beraber/gba-yap.py
      - if: always()
        run: cd /tmp/gba && git init -q -b beraber-yukseklik && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Bina yükseklikleri" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" beraber-yukseklik
  bina:
    if: github.event.inputs.is == 'bina'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env: { OUT: /tmp/bina }
    steps:
      - uses: actions/checkout@v4
      - run: pip install --break-system-packages ijson && mkdir -p /tmp/bina && python3 scraper/beraber/gba-bina.py
      - if: always()
        run: cd /tmp/bina && git init -q -b beraber-bina && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Bina tabanları" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" beraber-bina
  ornek:
    if: github.event.inputs.is == 'ornek' || github.event.inputs.is == 'ikisi'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: { TZ: Europe/Istanbul, OUT: /tmp/ornek }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tarayıcı
        working-directory: scraper
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Örnekleri üret
        working-directory: scraper
        run: node beraber/ornek.mjs
      - name: Dala yaz
        if: always()
        run: |
          cd /tmp/ornek && git init -q -b beraber-ornek && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Örnek görseller" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-ornek
  olcum:
    if: github.event.inputs.is == 'olcum' || github.event.inputs.is == 'ikisi'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { TZ: Europe/Istanbul, OUT: /tmp/olcum }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Araçlar
        run: |
          pip install -q overturemaps duckdb
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Overture yerleri (Türkiye çerçevesi)
        run: overturemaps download --bbox=25.6,35.8,44.9,42.2 -f geoparquet --type=place -o /tmp/ov.parquet && ls -la /tmp/ov.parquet
      - name: OpenStreetMap kopyası
        run: |
          curl -fsSL --retry 3 -o /tmp/tr.pbf https://download.geofabrik.de/europe/turkey-latest.osm.pbf
          osmium tags-filter /tmp/tr.pbf nwr/amenity,tourism,leisure,shop,historic,office,craft -o /tmp/p.pbf --overwrite
          osmium export /tmp/p.pbf -f geojsonseq -o /tmp/poi.seq --overwrite
          osmium tags-filter /tmp/tr.pbf w/building -o /tmp/b.pbf --overwrite
          osmium tags-filter /tmp/b.pbf w/height w/building:levels -o /tmp/h.pbf --overwrite
          B=$(osmium fileinfo -e -g data.count.ways /tmp/b.pbf); Y=$(osmium fileinfo -e -g data.count.ways /tmp/h.pbf); echo "{\"bina\":$B,\"yukseklik_bilgili\":$Y}" > /tmp/bina.json; cat /tmp/bina.json
      - name: Ölç
        run: python scraper/beraber/olcum.py
      - name: Dala yaz
        if: always()
        run: |
          cd /tmp/olcum && git init -q -b beraber-olcum && git add . && git -c user.name=nvny -c user.email=nvny@users.noreply.github.com commit -qm "Ölçüm" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" beraber-olcum
