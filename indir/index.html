<style>
:root{--nar:#ff3b6b;--g1:#FF6B8F;--g2:#7C5CFF;--g3:#1D1F4A;--f-disp:"Bricolage Grotesque",system-ui,sans-serif;--f-body:"Onest",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 20% 0%,#3a1f5c,#14163a 50%,#0a0b19);color:#fff;font-family:var(--f-body)}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));text-align:center}
.tile{position:relative;display:grid;place-items:center;width:150px;height:150px;border-radius:34px;background:radial-gradient(120% 90% at 20% 10%,#3a1f5c,#14163a 55%,#0a0b19);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 1.5px rgba(255,255,255,.14)}
.wm{display:flex;flex-direction:column;font:800 30px/.9 var(--f-disp);font-variation-settings:"wdth" 85;letter-spacing:-.02em;text-align:left}
.O{display:inline-block;width:.86em;height:.86em;vertical-align:-.08em;margin:0 .01em}
.O svg{width:100%;height:100%;overflow:visible}
h1{margin:6px 0 0;font:800 32px/1.05 var(--f-disp);letter-spacing:-.02em}
p.s{margin:0;font:600 11px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;width:min(340px,100%);padding:18px 24px;border:0;border-radius:18px;background:linear-gradient(115deg,var(--nar),#ff7a59);color:#fff;font:800 19px var(--f-disp);cursor:pointer;overflow:hidden;box-shadow:0 14px 34px rgba(255,59,107,.45);-webkit-tap-highlight-color:transparent}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:55%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45) 50%,transparent);transform:translateX(-130%) skewX(-18deg);animation:sw 3.4s cubic-bezier(.45,.05,.25,1) .5s infinite}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px}
@keyframes sw{0%{transform:translateX(-130%) skewX(-18deg)}55%,100%{transform:translateX(260%) skewX(-18deg)}}
.how{width:min(380px,100%);padding:18px 20px;border-radius:18px;background:rgba(255,255,255,.07);text-align:left;font:500 15px/1.5 var(--f-body)}
.how[hidden]{display:none}
.how ol{margin:8px 0 0;padding-left:22px}.how li{margin:6px 0}
.how kbd{display:inline-block;padding:0 6px;border-radius:6px;background:rgba(255,255,255,.16);font:700 13px var(--f-body)}
.how a.alt{display:inline-block;margin-top:10px;padding:12px 16px;border-radius:14px;background:#fff;color:#14163a;font:800 15px var(--f-body);text-decoration:none}
.site{color:rgba(255,255,255,.75);font:600 14px var(--f-body)}
.os{display:flex;align-items:center;gap:10px;margin-top:8px}
.os .by{font:300 14px Poppins,system-ui,sans-serif;opacity:.6}
.os svg{width:28px;height:28px;fill:#fff}
.os .w{font:300 21px/1 Poppins,system-ui,sans-serif}.os .w b{font-weight:800}
@media (prefers-reduced-motion:reduce){.btn::after{animation:none}}
</style>
</head>
<body>
<main>
  <div class="tile" aria-hidden="true"><div class="wm"><span>NE VAR</span><span>NE Y<span class="O"><svg viewBox="0 0 100 100"><defs><radialGradient id="g" cx="34%" cy="28%" r="82%"><stop offset="0" stop-color="#FF6B8F"/><stop offset=".55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#1D1F4A"/></radialGradient></defs><path d="M66 66L89 89" stroke="#FF3B6B" stroke-width="15" stroke-linecap="round"/><circle cx="44" cy="44" r="31" fill="none" stroke="#fff" stroke-width="13"/><circle cx="44" cy="44" r="25" fill="url(#g)"/><path d="M26 34 A20 20 0 0 1 40 22" fill="none" stroke="rgba(255,255,255,.82)" stroke-width="4.5" stroke-linecap="round"/></svg></span>K</span></div></div>
  <div>
    <h1>Uygulamamızı indirin</h1>
    <p class="s">Android · iPhone · ücretsiz</p>
  </div>
  <button class="btn" id="go" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Uygulamayı indir</button>
  <div class="how" id="how" hidden></div>
  <a class="site" href="../">Önce siteye göz at → nevarneyok.net.tr</a>
  <div class="os" aria-label="by oneside"><span class="by">by</span><svg viewBox="0 0 537 537" aria-hidden="true"><rect x="261" y="0" width="14" height="537"/><rect x="0" y="261" width="537" height="14"/><path d="M275 104C275 214 318 261 428 261H275Z"/><path d="M261 434C261 320 222 275 99 275H261Z"/></svg><span class="w">one<b>side</b></span></div>
</main>
<script>
(function(){
  var ua=navigator.userAgent,H=document.getElementById("how"),B=document.getElementById("go"),dp=null;
  var ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),and=/Android/i.test(ua),
      inApp=/Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|TikTok|musical_ly|Twitter|Snapchat|LinkedInApp/i.test(ua),samsung=/SamsungBrowser/i.test(ua);
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true){location.replace("../");return}
  addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e});
  addEventListener("appinstalled",function(){ev("uygulama-kuruldu","Uygulama kuruldu");B.hidden=true;show("<p><b>Kuruldu!</b> Ne Var Ne Yok artık uygulamalarının arasında.</p>")});
  function ev(p,t){try{window.goatcounter&&goatcounter.count&&goatcounter.count({path:p,title:t,event:true})}catch(e){}}
  function show(h){H.innerHTML=h;H.hidden=false}
  function steps(){
    if(inApp)return and?'<p>Bu sayfa Instagram\'ın içinde açıldı; uygulama buradan kurulamıyor.</p><a class="alt" href="intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end">Chrome\'da aç</a>'
      :'<p>Bu sayfa Instagram\'ın içinde açıldı. Kurmak için:</p><ol><li>Sağ üstteki <kbd>⋯</kbd> menüsüne dokun</li><li><b>"Tarayıcıda aç"</b>ı seç</li><li>Açılınca "Uygulamayı indir"e dokun</li></ol>';
    if(ios)return '<p>iPhone\'da üç adımda kurulur:</p><ol><li>Alttaki <kbd>Paylaş</kbd> simgesine (kare ve yukarı ok) dokun</li><li><b>"Ana Ekrana Ekle"</b>yi seç</li><li>Sağ üstte <b>"Ekle"</b>ye dokun</li></ol>';
    if(samsung)return '<p>Samsung İnternet\'te:</p><ol><li>Alttaki <kbd>☰</kbd> menüye dokun</li><li><b>"Sayfayı ekle"</b> → <b>"Ana ekran"</b>ı seç</li></ol>';
    if(and)return '<p>Chrome\'da:</p><ol><li>Sağ üstteki <kbd>⋮</kbd> menüye dokun</li><li><b>"Uygulamayı yükle"</b>yi seç</li></ol>';
    return '<p>Bilgisayarda adres çubuğunun sağındaki <kbd>⊕ Yükle</kbd> simgesine tıkla ya da bu sayfayı telefonunda aç.</p>';
  }
  if(inApp||ios)show(steps());
  B.addEventListener("click",function(){ev("indir-sayfasi-dugme","İndirme sayfasında düğmeye basıldı");
    if(dp){var d=dp;dp=null;d.prompt();d.userChoice.then(function(r){if(r.outcome!=="accepted")show(steps())});return}
    show(steps());H.scrollIntoView({behavior:"smooth",block:"center"});
  });
})();
</script>
<script data-goatcounter="https://nevarneyok.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
